<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="porto-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="porto-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge / Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0f172a" />
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="url(#porto-grad)" stroke-width="6" opacity="0.8" />
  
  <!-- Modern Geometric Container Crane & Port Dock Motif -->
  <g transform="translate(48, 48)">
    <!-- Container stacks (isometric modern stylized) -->
    <!-- Lower Left Container -->
    <path d="M 96 230 L 192 174 L 192 270 L 96 326 Z" fill="#0284c7" opacity="0.9" />
    <path d="M 192 174 L 288 230 L 288 326 L 192 270 Z" fill="#0369a1" />
    <path d="M 96 230 L 192 174 L 288 230 L 192 286 Z" fill="#38bdf8" />

    <!-- Container Ribs -->
    <line x1="128" y1="211" x2="128" y2="307" stroke="#0369a1" stroke-width="4" opacity="0.6"/>
    <line x1="160" y1="192" x2="160" y2="288" stroke="#0369a1" stroke-width="4" opacity="0.6"/>
    <line x1="224" y1="192" x2="224" y2="288" stroke="#075985" stroke-width="4" opacity="0.6"/>
    <line x1="256" y1="211" x2="256" y2="307" stroke="#075985" stroke-width="4" opacity="0.6"/>

    <!-- Upper Right Container -->
    <path d="M 192 140 L 288 84 L 288 180 L 192 236 Z" fill="#6366f1" opacity="0.95" />
    <path d="M 288 84 L 384 140 L 384 236 L 288 180 Z" fill="#4f46e5" />
    <path d="M 192 140 L 288 84 L 384 140 L 288 196 Z" fill="#818cf8" />

    <!-- Container Ribs Upper -->
    <line x1="224" y1="121" x2="224" y2="217" stroke="#4338ca" stroke-width="4" opacity="0.6"/>
    <line x1="256" y1="102" x2="256" y2="198" stroke="#4338ca" stroke-width="4" opacity="0.6"/>
    <line x1="320" y1="102" x2="320" y2="198" stroke="#3730a3" stroke-width="4" opacity="0.6"/>
    <line x1="352" y1="121" x2="352" y2="217" stroke="#3730a3" stroke-width="4" opacity="0.6"/>

    <!-- Harbor Pulse Nodes / Signal Rings -->
    <circle cx="288" cy="84" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="192" cy="140" r="6" fill="#a855f7" />
    <circle cx="384" cy="140" r="6" fill="#38bdf8" />
  </g>
</svg>
