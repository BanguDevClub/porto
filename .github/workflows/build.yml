name: Native Multi-Platform Build & Release Matrix

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Create a draft release with compiled artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Native Cross-Platform Build Matrix (Linux GNU, Linux MUSL, Windows, macOS)
  # ----------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 GLIBC (Ubuntu 22.04 LTS for wide GLIBC compatibility)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64-gnu
            args: --target x86_64-unknown-linux-gnu
            os_label: Linux (x86_64 GLIBC)
            is_musl: false

          # Linux x86_64 MUSL (Static Standalone)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: linux-x86_64-musl
            args: --target x86_64-unknown-linux-musl
            os_label: Linux (x86_64 MUSL)
            is_musl: true

          # Windows x86_64 (Native MSVC)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            args: --target x86_64-pc-windows-msvc
            os_label: Windows (x86_64)
            is_musl: false

          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            args: --target aarch64-apple-darwin
            os_label: macOS (Apple Silicon)
            is_musl: false

          # macOS Intel
          - platform: macos-13
            target: x86_64-apple-darwin
            name: macos-x86_64
            args: --target x86_64-apple-darwin
            os_label: macOS (Intel)
            is_musl: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime (Node 24 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-specific GTK3, WebKit2GTK, MUSL tools and build prerequisites
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file
          if [ "${{ matrix.is_musl }}" = "true" ]; then
            sudo apt-get install -y musl-tools musl-dev
          fi

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Run Svelte 5 & TypeScript Diagnostic Checks
        run: npm run check

      - name: Compile Frontend Assets
        run: npm run build

      # Build Tauri Desktop Application (or standalone MUSL release)
      - name: Build Tauri Desktop Application (GLIBC, Windows, macOS)
        if: matrix.is_musl != true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Porto v__VERSION__'
          releaseBody: 'See the attached assets to download Porto for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Build Linux MUSL Static Binary
      - name: Build Linux MUSL Target
        if: matrix.is_musl == true
        shell: bash
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          export RUSTFLAGS="-C target-feature=-crt-static -C link-arg=-lm"
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path src-tauri/Cargo.toml

      # Stage artifacts for upload (Linux / macOS)
      - name: Stage Release Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging/
          
          # Target release binary
          if [ -f "src-tauri/target/${{ matrix.target }}/release/porto" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/porto" "staging/porto-${{ matrix.name }}"
          elif [ -f "src-tauri/target/release/porto" ]; then
            cp "src-tauri/target/release/porto" "staging/porto-${{ matrix.name }}"
          fi

          # Target release bundles (deb, rpm, AppImage, dmg, app)
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          [ ! -d "$BUNDLE_DIR" ] && BUNDLE_DIR="src-tauri/target/release/bundle"

          if [ -d "$BUNDLE_DIR" ]; then
            # Debian packages
            find "$BUNDLE_DIR/deb" -type f -name "*.deb" -exec cp {} staging/ \; 2>/dev/null || true
            # RPM packages
            find "$BUNDLE_DIR/rpm" -type f -name "*.rpm" -exec cp {} staging/ \; 2>/dev/null || true
            # AppImage packages
            find "$BUNDLE_DIR/appimage" -type f -name "*.AppImage" -exec cp {} staging/ \; 2>/dev/null || true
            # macOS DMG packages
            find "$BUNDLE_DIR/dmg" -type f -name "*.dmg" -exec cp {} staging/ \; 2>/dev/null || true
            # macOS .app bundle zip
            if [ -d "$BUNDLE_DIR/macos" ]; then
              cd "$BUNDLE_DIR/macos"
              zip -r "../../../../../staging/porto-${{ matrix.name }}.app.zip" *.app 2>/dev/null || true
              cd - > /dev/null
            fi
          fi

          ls -la staging/

      # Stage artifacts for upload (Windows)
      - name: Stage Release Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging/
          
          # Standalone EXE binary
          if [ -f "src-tauri/target/${{ matrix.target }}/release/porto.exe" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/porto.exe" "staging/porto-windows-x86_64.exe"
          elif [ -f "src-tauri/target/release/porto.exe" ]; then
            cp "src-tauri/target/release/porto.exe" "staging/porto-windows-x86_64.exe"
          fi

          # Target installers (NSIS / MSI)
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          [ ! -d "$BUNDLE_DIR" ] && BUNDLE_DIR="src-tauri/target/release/bundle"

          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR/nsis" -type f -name "*.exe" -exec cp {} staging/ \; 2>/dev/null || true
            find "$BUNDLE_DIR/msi" -type f -name "*.msi" -exec cp {} staging/ \; 2>/dev/null || true
          fi

          ls -la staging/

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: porto-${{ matrix.name }}
          path: staging/*
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 2: Create macOS Universal Binary (Lipo Fat Binary: arm64 + x86_64)
  # ----------------------------------------------------------------------------
  macos-universal:
    name: macOS (Universal2 Fat Binary)
    needs: [build]
    runs-on: macos-latest
    steps:
      - name: Download Apple Silicon Artifacts
        uses: actions/download-artifact@v4
        with:
          name: porto-macos-aarch64
          path: staging-aarch64

      - name: Download Intel Mac Artifacts
        uses: actions/download-artifact@v4
        with:
          name: porto-macos-x86_64
          path: staging-x86_64

      - name: Assemble Universal2 Binary via Lipo
        run: |
          mkdir -p staging-universal/
          lipo -create \
            staging-aarch64/porto-macos-aarch64 \
            staging-x86_64/porto-macos-x86_64 \
            -output staging-universal/porto-macos-universal
          chmod +x staging-universal/porto-macos-universal
          file staging-universal/porto-macos-universal

      - name: Upload macOS Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: porto-macos-universal
          path: staging-universal/*
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 3: Consolidate & Publish GitHub Release (Tags / Manual Trigger)
  # ----------------------------------------------------------------------------
  publish-release:
    name: Consolidate & Publish Release
    needs: [build, macos-universal]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.draft_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Release Assets & Generate Checksums
        run: |
          mkdir -p release-assets/
          
          find all-artifacts -type f -exec cp {} release-assets/ \;
          
          cd release-assets/
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cd ..
          
          echo "=== Consolidated Release Assets ==="
          ls -la release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Porto ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
